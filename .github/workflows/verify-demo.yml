name: verify-deployed-demo
# This repository's Vercel integration emits legacy commit statuses, not deployment records.
# Start only AFTER its success status, avoiding a check/Render wait cycle.
on:
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the approved master release to verify (read-only)
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify approved master history before checkout
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$EVENT_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }
          head=$(gh api "repos/$REPO/commits/master" --jq .sha)
          relation=$(gh api "repos/$REPO/compare/$sha...$head" --jq .status)
          case "$relation" in identical|ahead) ;; *) echo 'Release is outside master history'; exit 1;; esac
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$REPO\" and .head_branch == \"master\")] | length")
          [ "$green" -gt 0 ] || { echo 'No successful exact-commit push checks'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact frontend and API source revisions
        env:
          DEPLOY_SHA: ${{ steps.approved.outputs.sha }}
          DEMO_API_URL: ${{ vars.DEMO_API_URL }}
          DEMO_WEB_URL: ${{ vars.DEMO_WEB_URL }}
        run: node frontend/scripts/deploy-gate.mjs --verify
      - name: Read-only deployed headers, CORS and routing smoke
        env:
          API_URL: ${{ vars.DEMO_API_URL }}
          WEB_URL: ${{ vars.DEMO_WEB_URL }}
        run: python scripts/smoke_deployed.py --api "$API_URL" --web "$WEB_URL"
