# Local same-site TLS stand-in only. Never use these test certificates on hosted services.
services:
  api:
    environment:
      WEB_ORIGIN: https://app.subtrack.test:8443
      API_ORIGIN: https://api.subtrack.test:8443
      AUTH_COOKIE_SITE: subtrack.test
      AUTH_SESSION_MODE: strict
      PUBLIC_DEMO_ONLY: 'false'
      REQUIRE_EMAIL_VERIFICATION: 'true'
  web:
    environment:
      VITE_API_BASE_URL: https://api.subtrack.test:8443/api/v1
  auth-proxy:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./scripts/auth-test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/auth-test-tls:/etc/subtrack-test-tls:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      default:
        aliases: [app.subtrack.test, api.subtrack.test]
