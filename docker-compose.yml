name: subtrack
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtrack}
      POSTGRES_USER: ${POSTGRES_USER:-subtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health/ready", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:5173").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:

