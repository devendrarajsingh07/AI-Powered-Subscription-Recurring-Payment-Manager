map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 8443 ssl;
  server_name app.subtrack.test;
  ssl_certificate /etc/subtrack-test-tls/cert.pem;
  ssl_certificate_key /etc/subtrack-test-tls/key.pem;
  location / {
    proxy_pass http://web:5173;
    proxy_set_header Host localhost:5173;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
  }
}
server {
  listen 8443 ssl;
  server_name api.subtrack.test;
  ssl_certificate /etc/subtrack-test-tls/cert.pem;
  ssl_certificate_key /etc/subtrack-test-tls/key.pem;
  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host api.subtrack.test:8443;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
}
